<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ถึงเธอ ในวันนี้</title>
<link href="https://fonts.googleapis.com/css2?family=Charmonman:wght@400;700&family=Mali:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#240c20;--bg2:#4a1535;--rose:#ff6b8f;--blush:#ffdbe4;--gold:#f6cf8a;--ivory:#fff5ef;--ink:#3a1230;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{color-scheme:dark;scroll-behavior:smooth}
*{box-sizing:border-box;margin:0}
body{background:radial-gradient(120% 80% at 50% 0,var(--bg2),var(--bg) 60%) fixed;color:var(--ivory);font-family:'Mali','Sarabun',sans-serif;line-height:1.9;overflow-x:hidden;min-height:100vh}
body.lock{overflow:hidden;height:100vh}
canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
h1,h2,.script{font-family:'Charmonman','Mali',serif;font-weight:700}
/* intro */
#intro{position:fixed;inset:0;z-index:50;display:grid;place-content:center;justify-items:center;gap:28px;background:radial-gradient(100% 70% at 50% 40%,#5c1a40,#1c0818);text-align:center;transition:opacity 1.2s,visibility 1.2s;padding:24px}
#intro.gone{opacity:0;visibility:hidden}
.env{position:relative;width:min(78vw,300px);aspect-ratio:3/2;background:#ffc9d6;border-radius:6px;box-shadow:0 30px 80px #0009,0 0 90px #ff6b8f55;animation:float 4s ease-in-out infinite;cursor:pointer;border:0}
.env::before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,transparent 49.5%,#f5a8bd 50%) left/50% 100% no-repeat,linear-gradient(225deg,transparent 49.5%,#f5a8bd 50%) right/50% 100% no-repeat;border-radius:6px}
.env i{position:absolute;left:0;right:0;top:0;height:62%;background:#ff9db5;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .8s}
.env b{position:absolute;left:50%;top:52%;translate:-50% -50%;font-size:2.4rem;color:#d1264f;z-index:2;text-shadow:0 2px 8px #0004;animation:beat 1.4s infinite}
.open i{transform:rotateX(180deg)}
.open{animation:none;scale:1.25;opacity:0;transition:scale 1s,opacity 1s .2s}
#intro p{font-size:1.15rem;color:var(--blush)}
#intro .script{font-size:2rem}
@keyframes float{50%{translate:0 -12px}}
@keyframes beat{50%{scale:1.2}}
/* sections */
main{position:relative;z-index:2}
section{min-height:100vh;display:grid;place-content:center;justify-items:center;padding:72px 22px;text-align:center}
.hero{gap:30px}
.arch{width:min(76vw,340px);aspect-ratio:3/4;border-radius:999px 999px 28px 28px;overflow:hidden;border:3px solid var(--gold);box-shadow:0 0 0 10px #ffffff10,0 0 70px #ff6b8f77,0 30px 60px #0008;position:relative}
.arch img{width:100%;height:100%;object-fit:cover;object-position:50% 30%;transform:scale(1.12);transition:transform 6s}
.show .arch img{transform:scale(1)}
.hero h1{font-size:clamp(2rem,8.5vw,3.4rem);line-height:1.45;max-width:14em;text-wrap:balance;text-shadow:0 0 30px #ff6b8f88}
.l{display:block;opacity:0;filter:blur(10px);translate:0 14px;transition:1.4s}
.show .l{opacity:1;filter:none;translate:0}
.show .l:nth-child(2){transition-delay:1.1s}
.hero .sub{color:var(--blush);font-size:1.1rem;opacity:0;transition:opacity 1.5s 2.4s}
.show .sub{opacity:1}
.hint{position:absolute;bottom:22px;left:50%;translate:-50% 0;animation:float 2s infinite;color:var(--gold);font-size:1.5rem}
.gal{gap:56px}
.gal h2{font-size:2rem;color:var(--gold)}
.row{display:grid;gap:60px;justify-items:center;width:100%;max-width:760px}
@media(min-width:760px){.row{grid-template-columns:1fr 1fr;align-items:center}}
.pol{background:var(--ivory);padding:12px 12px 52px;border-radius:6px;width:min(78vw,320px);box-shadow:0 24px 50px #000a;rotate:-4deg;position:relative;cursor:pointer;transition:rotate .5s,scale .5s,opacity 1s,translate 1s;opacity:0;translate:0 50px;border:0;color:var(--ink);font:inherit}
.pol:nth-child(2){rotate:3.5deg}
.pol.in{opacity:1;translate:0}
.pol:hover,.pol:focus-visible{rotate:0deg;scale:1.04;outline:3px solid var(--rose)}
.pol img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:3px}
.pol.wide img{aspect-ratio:4/3}
.pol span{position:absolute;bottom:12px;left:0;right:0;font-family:'Charmonman',serif;font-size:1.35rem;font-weight:700}
.pol::after{content:"";position:absolute;top:-14px;left:50%;translate:-50% 0;width:90px;height:28px;background:#f6cf8aaa;rotate:-3deg}
.end{gap:26px}
.end h2{font-size:clamp(2.2rem,9vw,3.8rem);line-height:1.4;text-shadow:0 0 36px #ff6b8f}
.end p{color:var(--blush);font-size:1.15rem}
.btn{margin-top:8px;font:inherit;font-size:1.2rem;font-weight:600;color:#fff;background:linear-gradient(135deg,#ff6b8f,#d1264f);border:0;border-radius:99px;padding:16px 38px;cursor:pointer;box-shadow:0 12px 40px #ff6b8f66;transition:scale .2s}
.btn:active{scale:.94}.btn:focus-visible{outline:3px solid var(--gold);outline-offset:4px}
.big{font-size:4.5rem;color:var(--rose);animation:beat 1.2s infinite;filter:drop-shadow(0 0 24px #ff6b8f)}
.rv{opacity:0;translate:0 30px;transition:1.2s}.rv.in{opacity:1;translate:0}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}}
</style></head><body class="lock">

P=P.filter(p=>{p.x+=p.vx+Math.sin(p.y/80)*.4;p.vy+=p.g;p.y+=p.vy;p.r+=p.vr;if(p.b)p.a-=.007;x.save();x.globalAlpha=Math.max(p.a,0)*.85;x.translate(p.x,p.y);x.rotate(p.r*.2);x.fillStyle=p.c;x.shadowColor=p.c;x.shadowBlur=14;x.font=p.s+'px serif';x.textAlign='center';x.fillText('♥',0,0);x.restore();return p.y<H+60&&p.a>0});
requestAnimationFrame(loop)}loop();
const env=document.getElementById('env'),intro=document.getElementById('intro');
env.onclick=()=>{env.classList.add('open');burst(innerWidth/2,innerHeight/2,40);setTimeout(()=>{intro.classList.add('gone');document.body.classList.remove('lock');document.getElementById('hero').classList.add('show')},900)};
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.25});
document.querySelectorAll('.pol,.rv').forEach((e,i)=>{e.style.transitionDelay=(i%3)*.15+'s';io.observe(e)});
document.querySelectorAll('.pol').forEach(p=>p.onclick=e=>burst(e.clientX,e.clientY,22));
document.getElementById('send').onclick=e=>{for(let i=0;i<5;i++)setTimeout(()=>burst(innerWidth*(.15+Math.random()*.7),innerHeight*(.5+Math.random()*.3),30),i*180);e.target.textContent='ส่งแล้วนะ ♥ รักเธอ'};
</script></body></html>
